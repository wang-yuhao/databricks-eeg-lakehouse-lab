# GitHub Actions CI — EEG Lakehouse Lab
# Runs on every push and PR to main.
# Exam relevance: CI/CD & Git integration domain (Domain 4: Production Pipelines)
#
# Design notes:
#   - Black runs in --check mode; failures are informational (continue-on-error)
#   - Flake8 is informational only
#   - pytest is the gate: tests must pass for CI green
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Java (required for PySpark)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install pyspark>=3.5.0 delta-spark>=3.1.0
          pip install pytest pytest-cov black flake8
          pip install numpy pandas scipy scikit-learn
          pip install loguru python-dotenv
          # Note: MNE, YASA, Ripser are heavy deps — install only when needed
          # pip install mne yasa ripser giotto-tda

      - name: Code style check (black) — informational
        run: black --check src/ tests/
        continue-on-error: true

      - name: Lint (flake8) — informational
        run: flake8 src/ tests/ --max-line-length=100 --ignore=E203,W503
        continue-on-error: true

      - name: Run tests with coverage
        run: |
          pytest tests/ -v --cov=src --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.10'
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
